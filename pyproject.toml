[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-benchmark"
dynamic = ["version"]
description = "Spatially grouped nested cross-validation benchmark for multispectral and hyperspectral supervised classification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
spectral-benchmark = "spectral_benchmark:main"

[tool.setuptools]
py-modules = ["spectral_benchmark"]

[tool.setuptools.dynamic]
version = { attr = "spectral_benchmark.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Conservative on purpose. E402 is ignored because spectral_benchmark.py must set
# BLAS thread-count environment variables *before* importing numpy.
select = ["E", "F"]
ignore = ["E402", "E501", "E741"]
